name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Mac App
      run: |
        pyinstaller --windowed --name PortraitFrame --icon=icon.icns viewer.py
    - name: Zip Mac App
      run: |
        cd dist
        zip -r PortraitFrame-mac.zip PortraitFrame.app
    - name: Upload Mac Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mac-app
        path: dist/PortraitFrame-mac.zip

  build-win:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Windows Exe
      run: |
        pyinstaller --onefile --windowed --icon=icon.ico --name PortraitFrame-win viewer.py
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: win-exe
        path: dist/PortraitFrame-win.exe

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Mac Artifact
      uses: actions/download-artifact@v4
      with:
        name: mac-app
        path: ./artifacts
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: win-exe
        path: ./artifacts
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/PortraitFrame-mac.zip
          ./artifacts/PortraitFrame-win.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
