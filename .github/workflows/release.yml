name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Mac App
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "1440x3440" --add-data "app:app" viewer.py
        cd dist
        zip -r 1440x3440-mac.zip 1440x3440.app/
    - name: Upload Mac Build
      uses: softprops/action-gh-release@v1
      with:
        files: dist/1440x3440-mac.zip

  build-win:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Build Windows Exe
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "1440x3440" --add-data "app;app" viewer.py
        Move-Item dist\1440x3440.exe dist\1440x3440-win.exe
    - name: Upload Windows Build
      uses: softprops/action-gh-release@v1
      with:
        files: dist/1440x3440-win.exe

  release:
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download Mac Artifact
      uses: actions/download-artifact@v4
      with:
        name: mac-app
        path: ./artifacts
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: win-exe
        path: ./artifacts
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./artifacts/PortraitFrame-mac.zip
          ./artifacts/PortraitFrame-win.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
